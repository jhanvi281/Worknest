<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkNest — Team Collaboration & Productivity Platform</title>
    <meta
      name="description"
      content="WorkNest is an enterprise team productivity platform uniting task tracking, workspaces, daily logs, encrypted file storage, and integrated video conferencing."
    />
    <meta name="theme-color" content="#F97316" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WorkNest — Team Collaboration & Productivity Platform" />
    <meta
      property="og:description"
      content="Enterprise team productivity platform uniting task tracking, workspaces, daily logs, encrypted file storage, and integrated video conferencing."
    />
    <meta property="og:site_name" content="WorkNest" />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WorkNest — Team Collaboration & Productivity Platform" />
    <meta
      name="twitter:description"
      content="Enterprise team productivity platform uniting task tracking, workspaces, daily logs, encrypted file storage, and integrated video conferencing."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          var saved = urlTheme || localStorage.getItem('worknest_theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        id="premount-loader"
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; transition: background-color 0.15s ease;"
      >
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background-color: #F97316; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.25);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
          <span style="font-size: 12px; font-weight: 600; color: #737373; letter-spacing: -0.01em;">Loading WorkNest...</span>
        </div>
      </div>
      <script>
        (function() {
          try {
            var loader = document.getElementById('premount-loader');
            if (loader && document.documentElement.classList.contains('dark')) {
              loader.style.backgroundColor = '#0A0A0A';
            } else if (loader) {
              loader.style.backgroundColor = '#FFFFFF';
            }
          } catch (e) {}
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
